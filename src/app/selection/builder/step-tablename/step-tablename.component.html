<div class="wrapper-table-names" >
        <div class="view" >
                <h1>Перечень параметров: 
                        </h1>
                <div class="info">
                        
                        <!-- {{dropBoxPropsMapConfig.get('RuComponentType').currentValue === 'Все' ? ' всех типов ' : ` типа компонента ${
                                `${dropBoxPropsMapConfig.get('RuComponentType').currentValue}`}`}}  -->
                        <p *ngFor="let column of columns; let i = index;">
                        {{alias.get(column)}}
                </p>
                </div>
        </div>
        <div class="table-names-srapper">
                <p class="step-description">Шаг {{index}}: Выбор таблицы компонента</p>
                <div class="table-names" *ngIf="componentTypes">
                        <p class="state-btn" *ngFor="let value of componentTypes"
                                [ngClass]="{type: true, 'state-btn-selected': current === value.RuComponentType}"
                        (click)="onValueSelected(value)">{{value.RuComponentType}}</p>
                </div>
        </div>
</div>
