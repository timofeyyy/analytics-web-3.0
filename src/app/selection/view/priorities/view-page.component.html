<div class="app-main">
    <div class="navigator-wrapper">
        <app-navigator [current]="'/selection-view'" [chartBlocked]="isChartBlocked()"
            [lastSavedBlocked]="isLastSavedBlocked() || isStorageEmpty()" />
    </div>
    <div class="workspace">
        <main>
            <div class="chart-wrapper">
                <aside class="aside-panel">
                    <div class="panel-name">
                        <p>{{alias.get(priority)}}</p>
                    </div>
                    <div class="tabs">
                        <ul class="parent">
                            <li class="tab parent-tab">
                                <p>Приоритеты</p>
                            </li>
                            <ul class="children">
                                <li *ngFor="let p of priorities; let i = index"
                                    [ngClass]="{tab: true, active: priority === p[0] && !chartSection}"
                                    (click)="priority = p[0];chartSection = false; changePriorityInStorage(p[0]); initColumns()">
                                    <p>
                                        {{i + 1}}
                                        {{alias.get(p[0])}}:
                                        {{p[1]}}
                                    </p>
                                </li>
                                <div class="line"></div>
                            </ul>
                            <!-- <li class="tab parent-tab">
                                <p>Графики</p>
                            </li>
                            <ul class="children">
                                <li *ngFor="let chart of chartNames; let i = index"
                                    [ngClass]="{tab: true, active: currentChartName === chart && chartSection }"
                                    (click)="chartSection = true; navigateToChartPage(chart)">
                                    <p>
                                        {{getChartalias(chart)}}
                                    </p>
                                </li>
                                <div class=" line">
                                </div>
                            </ul> -->
                        </ul>
                    </div>
                </aside>
                <div class="chart-wrapper-main">
                    <header>
                        <div class="tabs">
                            <div *ngFor="let ruComponentType of getKeyArrayFromStorage()"
                                [ngClass]="{tab: true, horizontal: true, active: selectedRuComponentType===ruComponentType}"
                                (click)="onRuComponentTypeSelected(ruComponentType); initColumns()">
                                <p>{{prioritySchemaWrapper2Map.get(ruComponentType)}} <span
                                        *ngIf="selectedRuComponentType===ruComponentType">({{all.length}})</span> </p>
                            </div>
                        </div>
                    </header>
                    <div class="body-main">
                        <iframe [src]="chartUrl" frameborder="0" *ngIf="chartSection; else table">
                        </iframe>
                        <ng-template #table>
                            <div class="t-body">
                                <div class="t-body-wrapper">
                                    <table align="left" *ngIf="all.length; else template">
                                        <thead>
                                            <tr>
                                                <td *ngFor="let column of columns">{{column}}</td>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let record of all">
                                                <td *ngFor="let value of getRecordsFromObjAsArray(record)">{{value}}
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <ng-template #template>
                                        <div class="warning">
                                            <div class="warning-wrapper">
                                                <div class="warning-header">
                                                    <img [src]="'assets/images/not_found.svg'" alt="img">
                                                    <p>Ничего не найдено</p>
                                                </div>
                                            </div>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                            <div class="t-footer">
                                <button class="rev" (click)="back()"><span>Вернуться к построению</span></button>
                                <button [ngClass]="{def: this.save, rev: !this.save}"
                                    (click)="onStateChange()">{{this.save
                                    ? 'Сохранить': 'Отчистить'}}</button>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <app-loader [ngStyle]="{display: loader ? 'block' : 'none'}" />
</div>
