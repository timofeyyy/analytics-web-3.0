<section class="records" [ngStyle]="{'border-radius': borderRadius}">
     <div class="header">
        <div class="block">
            <div class="search">
                <input type="text" [value]="searchValue" [placeholder]="parameterAlias" (input)="search($event)">
            </div>
            <app-record-sorting [rows]="rows" (onSortDirectionChanged)="sortDirectionChanged($event)" class="record-sorting"/>
        </div>
        <div class="block" [style]="{'display':'flex'}">
            <p>Кол-во компонентов</p>
        </div>
    </div>
    <div class="view">
        <div class="row layout" *ngFor="let row of rows" (click)="noRedirect ? getValue(row.value, true) : openCatalog(row.value)" >
            <!-- [ngClass]="{activated: row.value == currentValue }" -->
            <div class="col">
                <p>{{row.value}}</p>
            </div>
            <div class="col">
                <p>{{row.prodSummary}}</p>
            </div>
        </div>
    </div>
</section>
