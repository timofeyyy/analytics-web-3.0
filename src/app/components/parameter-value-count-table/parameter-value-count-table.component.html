     <div class="header">
        <div class="block">
            <div class="search">
                <input type="text" [placeholder]="alliasName" (input)="search($event)">
            </div>
            <app-record-sorting [rows]="rows" [countName]="'Количество'" [valueName]="'Производитель'" class="record-sorting"/>
        </div>
        <div class="block" [ngStyle]="{display: hideLabel ? 'none' : 'flex' }">
            <p>Кол-во компонентов с этим параметром</p>
        </div>
    </div>
    <div class="view">
        <div class="row layout" *ngFor="let row of rows" (click)="noRedirect ? getValue(row.value) : openCatalog(row.value)" [ngClass]="{activated: row.value == currentValue}">
            <div class="col">
                <p>{{row.value}}</p>
            </div>
            <div class="col">
                <p>{{row.prodSummary}}</p>
            </div>
        </div>
    </div>
</section>
