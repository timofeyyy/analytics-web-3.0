<p *ngIf="input; else templateName">
    <app-input [currentValue]="inputValue" [inputDisabled]="inputDisabled" [alias]="aliasName" [name]="name"
        (onChanged)="openClose($event)" />
</p>
<ng-template #templateName>
    <!-- <app-dropbox
        [ngStyle]="{'display': err? 'none' : 'block'}"
        [name]="name"
        [currentName]="currentName"
        [alias]="aliasName"
        [values]="values"
        [currentValue]="currentValue"
        (onChanged)="openClose($event)"
    />  --> 
    <div class="select-list-wrapper">
        <p>{{aliasName}}</p>
        <app-select-list class="select-list" [fitstSelectedValue]="true" [currentValue]="currentValue" [ngStyle]="{'display': err? 'none' : 'block'}"  [values]="values"
            (onValueChanged)="openClose({currentName: currentName, currentValue: $event})" />
    </div>
</ng-template>
