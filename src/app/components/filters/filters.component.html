<div class="popup-window">
    <div class="filters">
        <div class="head">
            <h1>Дополнительные параметры</h1>
        </div>
        <div class="body">
            <div class="base">
                <!-- <app-dropbox-provider [aliasName]="`${alias.get('ruComponentType')}`"
                    [currentName]="currentDropBoxName" [all]="all" [propsMap]="dropBoxPropsMapConfig"
                    [name]="'ruComponentType'" (onStateChanged)="onCurrentDropBoxNameChnaged($event)"
                    (onStateChanged)="onRuComponentTypeChanged($event)" /> -->
                <app-dropbox-provider 
                    [inputValue]="dropBoxPropsMapConfig.get('manufacturerName').currentValue"
                    [aliasName]="`${alias.get('manufacturerName')}`" 
                    [currentName]="currentDropBoxName" 
                    [all]="all"
                    [propsMap]="dropBoxPropsMapConfig" 
                    [name]="'manufacturerName'"
                    (onStateChanged)="onCurrentDropBoxNameChnaged($event)" />
                <app-dropbox-provider 
                    [inputValue]="dropBoxPropsMapConfig.get('ruComponentKind').currentValue"
                    [aliasName]="`${alias.get('ruComponentKind')}`" 
                    [currentName]="currentDropBoxName" 
                    [all]="all"
                    [propsMap]="dropBoxPropsMapConfig" 
                    [name]="'ruComponentKind'"
                    (onStateChanged)="onCurrentDropBoxNameChnaged($event)" />
            </div>
            <div class="additional">
                <app-dropbox-provider *ngFor="let column of selectedColumns"
                    [inputValue]="dropBoxPropsMapConfig.get(column).currentValue"
                    [aliasName]="`${alias.get(column)}`"
                    [currentName]="currentDropBoxName" 
                    [all]="all" 
                    [propsMap]="dropBoxPropsMapConfig" 
                    [name]="column"
                    (onStateChanged)="onCurrentDropBoxNameChnaged($event)" />
            </div>
        </div>
        <div class="footer">
            <button class="rev" (click)="cancel()">Отмена</button>
            <button class="def" (click)="apply()">Применить</button>
        </div>
    </div>
</div>
