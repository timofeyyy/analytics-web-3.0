<div class="options">
    <div class="list-wrapper">
        <div class="list">
            <p class="label">{{allias}}</p>
            <ul class="values">
                <li class="current" (click)="openClose()">
                    <p>{{options.currentValue}}</p>
                    <div></div>
                </li>
            </ul>
        </div>
    </div>
    <div class="values-wrapper">
        <ul [ngStyle]="{display: options.open ? 'block' : 'none'}">
            <li class="search">
                <input type="text" placeholder="поиск" (input)="search($event)">
            </li>
            <li *ngFor="let value of options.values" (click)="openClose(value)">
                {{value}}
            </li>
        </ul>
    </div>
</div>
