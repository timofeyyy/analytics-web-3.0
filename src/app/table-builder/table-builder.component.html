<div class="app-main">
    <div class="navigator-wrapper">
        <app-navigator />
    </div>
    <div class="workspace">
        <main>
            <div class="view">
                <div class="info">
                    <h1>{{displayedRuComponentTypeHeader()}}</h1>
                    <p *ngFor="let column of selectedColumns; let i = index">{{i}} {{allias.get(column)}}</p>
                </div>
                <a [href]="'/table-view'">Пропустить и просмтореть всю таблицу</a>
            </div>
            <div class="controlles">
                <div class="steps-panel">
                    <div class="step step1" [ngStyle]="{'left': stepper.get('step1')?.step + '%'}">
                        <p *ngFor="let ruComponentType of displayedRuComponentTypes"
                            [ngClass]="{type: true,  activated: dropBoxPropsMapConfig.get('ruComponentType').currentValue === ruComponentType}"
                            (click)="onTypeSelected(ruComponentType)">{{ruComponentType}}</p>
                    </div>
                    <div class="step step2" [ngStyle]="{'left': stepper.get('step2')?.step + '%'}">
                        <!-- <div class="action-blocks">
                            <div class="action-block">

                            </div>
                            <div class="action-block">

                            </div>
                        </div>-->
                        <div class="columns"> 
                            <div class="column" *ngFor="let column of displayedColumns">
                                <input type="checkbox" (click)="onColumnSelected(column)"
                                    [checked]="!selectedColumnsContains(column)" 
                                    [disabled]="autoGeneratedSchema"
                                    />
                                <p>{{allias.get(column)}}</p>
                            </div>
                        </div>
                        <div class="actions">
                             <div class="column" >
                                <input type="checkbox" (click)="onAutoGeneratedSchemaSelected()" />
                                <p>Использовать рекомендуемую схему</p>
                            </div>
                        </div>
                    </div>
                    <div class="step step3" [ngStyle]="{'left': stepper.get('step3')?.step + '%'}">
                        <app-dropbox-provider *ngFor="let column of selectedColumns"
                            [alliasName]="`${allias.get(column)}`" [currentName]="currentDropBoxName" [all]="all"
                            [propsMap]="dropBoxPropsMapConfig" [name]="column"
                            (onStateChanged)="onCurrentDropBoxNameChnaged($event)" />
                    </div>
                </div>
                <div class="btns">
                    <button class="rev" (click)="prev()">Назад</button>
                    <button class="def" (click)="next()">Дальше</button>
                </div>
            </div>
        </main>
    </div>
    <app-loader [ngStyle]="{display: loader ? 'block' : 'none'}" />
</div>
